[package]
name = "overte-directory"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.15.6"
async-stream = "0.3.6"
axum = "0.8.9"
axum-htmx = "0.8.1"
axum-login = "0.18.0"
axum-messages = "0.8.0"
axum_session = "0.19.0"
axum_session_sqlx = "0.8.0"
displaydoc = "0.2.5"
futures = "0.3.32"
include_dir = "0.7.4"
mime_guess = "2.0.5"
notify = "8.2.0"
password-auth = "1.0.0"
serde = "1.0.228"
sqlx = { version = "0.8.6", features = ["postgres", "uuid"] }
thiserror = "2.0.18"
time = "0.3.47"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "signal"] }
tower = "0.5.3"
tower-csrf = "0.1.0"
tower-http = { version = "0.6.10", features = ["fs"] }
tower-livereload = "0.10.3"
tower-sessions = { version = "0.14.0", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.23.1"

[build-dependencies]
fs-utils = "1.1.0"
