{% extends "_base.html" %}

{% block title %}
Register page :3
{% endblock %}

{% block content %}
<h1>Register Page</h1>
<form method="post">
  <fieldset>
    <legend>User login</legend>
    <p>
      <label for="username">Username</label>
      <input name="username" id="username" />
    </p>
    <p>
      <label for="password">Password</label>
      <input name="password" id="password" type="password" />
    </p>
  </fieldset>

  <input type="submit" value="login" />
</form>
{% endblock %}
